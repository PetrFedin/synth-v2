name: Synchronize recompute Tranche B specification

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  synchronize:
    if: github.head_ref == 'feat/recompute-orchestration-persistence'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/recompute-orchestration-persistence
          fetch-depth: 0

      - name: Append authoritative architecture and master-plan checkpoints
        shell: bash
        env:
          ARCH_SPEC_B64: 
          MASTER_SPEC_B64: 
        run: |
          set -euo pipefail
          if ! grep -Fq '## 2026-10-09 — Product Engineering Recompute Orchestration Tranche B1' ARCHITECTURE.md; then
            printf '\n\n' >> ARCHITECTURE.md
            printf '%s' "$ARCH_SPEC_B64" | base64 --decode >> ARCHITECTURE.md
          fi
          if ! grep -Fq '### 2026-10-09 — Recompute orchestration Tranche B1 persistence and recovery' docs/SYNTH_V2_INTEGRATION_MASTER_PLAN_2026-10-01.md; then
            printf '\n\n' >> docs/SYNTH_V2_INTEGRATION_MASTER_PLAN_2026-10-01.md
            printf '%s' "$MASTER_SPEC_B64" | base64 --decode >> docs/SYNTH_V2_INTEGRATION_MASTER_PLAN_2026-10-01.md
          fi

      - name: Commit synchronized specification and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/append-recompute-tranche-b-spec.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ARCHITECTURE.md docs/SYNTH_V2_INTEGRATION_MASTER_PLAN_2026-10-01.md .github/workflows/append-recompute-tranche-b-spec.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'docs: synchronize recompute orchestration Tranche B1'
          git push origin HEAD:feat/recompute-orchestration-persistence
