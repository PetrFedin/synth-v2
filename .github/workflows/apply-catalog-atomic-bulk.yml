name: Apply Catalog Atomic Bulk

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
  push:
    branches:
      - automation/catalog-atomic-bulk
    paths:
      - '.automation/catalog-atomic-bulk.patch.gz.b64.*'
      - '.github/workflows/apply-catalog-atomic-bulk.yml'

permissions:
  contents: write

concurrency:
  group: apply-catalog-atomic-bulk
  cancel-in-progress: false

jobs:
  apply:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: automation/catalog-atomic-bulk
          fetch-depth: 0

      - name: Reconstruct and verify patch
        shell: bash
        run: |
          set -euo pipefail
          cat .automation/catalog-atomic-bulk.patch.gz.b64.* | base64 --decode > /tmp/catalog-atomic-bulk.patch.gz
          echo 'f7b2a0111860426ec36c531e41ab3701d737cd79d1280f22205ba4b3a5f3f702  /tmp/catalog-atomic-bulk.patch.gz' | sha256sum --check --strict
          gzip --test /tmp/catalog-atomic-bulk.patch.gz
          gzip --decompress --stdout /tmp/catalog-atomic-bulk.patch.gz > /tmp/catalog-atomic-bulk.patch
          echo '436bd6cf957945dfa47848f5802cb0781622dedf1180ccae1e7ae75bac3fc6a4  /tmp/catalog-atomic-bulk.patch' | sha256sum --check --strict
          git apply --check /tmp/catalog-atomic-bulk.patch
          git apply --index /tmp/catalog-atomic-bulk.patch

      - name: Install locked dependencies
        run: npm ci

      - name: Verify Catalog atomic bulk operations
        run: npm run verify

      - name: Commit verified implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -f .automation/catalog-atomic-bulk.patch.gz.b64.*
          rm -f .github/workflows/apply-catalog-atomic-bulk.yml
          rmdir .automation 2>/dev/null || true
          git add -A
          test ! -e .github/workflows/apply-catalog-atomic-bulk.yml
          test -z "$(git ls-files '.automation/catalog-atomic-bulk.patch.gz.b64.*')"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add atomic catalog bulk operations'
          git push origin HEAD:automation/catalog-atomic-bulk
