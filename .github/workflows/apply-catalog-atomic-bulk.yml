name: Apply Catalog Atomic Bulk

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
  push:
    branches:
      - automation/catalog-atomic-bulk
    paths:
      - '.automation/catalog-atomic-bulk.patch.gz.b64'
      - '.github/workflows/apply-catalog-atomic-bulk.yml'

permissions:
  contents: write

concurrency:
  group: apply-catalog-atomic-bulk
  cancel-in-progress: false

jobs:
  apply:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: automation/catalog-atomic-bulk
          fetch-depth: 0

      - name: Reconstruct and verify patch
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .automation/catalog-atomic-bulk.patch.gz.b64 > /tmp/catalog-atomic-bulk.patch.gz
          echo 'd09c8230380fbb04f7258528fdbf83d13c4c4e99fc1ca4bc10f53ec0599562ca  /tmp/catalog-atomic-bulk.patch.gz' | sha256sum --check --strict
          gzip --test /tmp/catalog-atomic-bulk.patch.gz
          gzip --decompress --stdout /tmp/catalog-atomic-bulk.patch.gz > /tmp/catalog-atomic-bulk.patch
          echo 'bee3273c39a0c5db3f93e597fba3310ad7508546e63df6162f3c9fa8a899ee1b  /tmp/catalog-atomic-bulk.patch' | sha256sum --check --strict
          git apply --check /tmp/catalog-atomic-bulk.patch
          git apply --index /tmp/catalog-atomic-bulk.patch

      - name: Install locked dependencies
        run: npm ci

      - name: Verify Catalog atomic bulk operations
        run: npm run verify

      - name: Commit verified implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -f .automation/catalog-atomic-bulk.patch.gz.b64
          rm -f .github/workflows/apply-catalog-atomic-bulk.yml
          rmdir .automation 2>/dev/null || true
          git add -A
          test ! -e .github/workflows/apply-catalog-atomic-bulk.yml
          test -z "$(git ls-files '.automation/catalog-atomic-bulk.patch.gz.b64')"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add atomic catalog bulk operations'
          git push origin HEAD:automation/catalog-atomic-bulk
