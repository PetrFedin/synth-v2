name: Apply Catalog Read Model

on:
  push:
    branches:
      - automation/catalog-read-model
    paths:
      - '.automation/catalog-read-model.patch.gz.b64.*'
      - '.github/workflows/apply-catalog-read-model.yml'

permissions:
  contents: write

concurrency:
  group: apply-catalog-read-model
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: automation/catalog-read-model
          fetch-depth: 0

      - name: Reconstruct and verify patch
        shell: bash
        run: |
          set -euo pipefail
          cat .automation/catalog-read-model.patch.gz.b64.* | base64 --decode > /tmp/catalog-read-model.patch.gz
          echo 'fd5269779957619ac51005e591b3cbce13ec60943615e1a8f0f7887a23252711  /tmp/catalog-read-model.patch.gz' | sha256sum --check --strict
          gzip --decompress --stdout /tmp/catalog-read-model.patch.gz > /tmp/catalog-read-model.patch
          echo '2041cf35e32dd0b9984d6c3527c37f00e9b3d51d55ca40857054b819c0523aad  /tmp/catalog-read-model.patch' | sha256sum --check --strict
          git apply --check /tmp/catalog-read-model.patch
          git apply --index /tmp/catalog-read-model.patch

      - name: Install locked dependencies
        run: npm ci

      - name: Verify Catalog read model
        run: npm run verify

      - name: Commit verified implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -f .automation/catalog-read-model.patch.gz.b64.*
          rm -f .github/workflows/apply-catalog-read-model.yml
          rmdir .automation 2>/dev/null || true
          git add -A
          test ! -e .github/workflows/apply-catalog-read-model.yml
          test -z "$(git ls-files '.automation/catalog-read-model.patch.gz.b64.*')"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add industrial catalog read model'
          git push origin HEAD:automation/catalog-read-model
