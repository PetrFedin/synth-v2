name: Apply industrial fixes

on:
  push:
    branches:
      - automation/generate-package-lock
    paths:
      - .automation/industrial-fixes.patch
      - .github/workflows/apply-industrial-fixes.yml

permissions:
  contents: write

concurrency:
  group: apply-industrial-fixes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      NPM_CONFIG_AUDIT: "false"
      NPM_CONFIG_FUND: "false"
      NPM_CONFIG_IGNORE_SCRIPTS: "true"
    steps:
      - name: Checkout automation branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: automation/generate-package-lock
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Generate deterministic dependency lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Apply verified patch
        run: |
          git apply --check .automation/industrial-fixes.patch
          git apply .automation/industrial-fixes.patch

      - name: Install from generated lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run full verification
        run: npm run verify

      - name: Commit verified result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: align industrial contracts and lock dependencies [applied]"
          git push origin HEAD:automation/generate-package-lock
