name: Apply PostgreSQL driver fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: apply-pg-driver-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.head_ref == 'automation/generate-package-lock' && !contains(github.event.pull_request.head.label, '[pg-driver-applied]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      NPM_CONFIG_AUDIT: "false"
      NPM_CONFIG_FUND: "false"
      NPM_CONFIG_IGNORE_SCRIPTS: "true"
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: syntha
          POSTGRES_PASSWORD: syntha_test
          POSTGRES_DB: syntha_v2_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U syntha -d syntha_v2_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: automation/generate-package-lock
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Apply remaining driver fixes and remove temporary automation
        run: |
          git apply --check .automation/fix-postgres-test-driver.patch
          git apply .automation/fix-postgres-test-driver.patch
          rm -f .automation/fix-postgres-test-driver.patch
          rm -f .github/workflows/apply-postgres-test-driver.yml
          rm -f .github/workflows/apply-pg-driver-pr.yml
          rm -f tests/pg-test-facade.mjs tests/pg-test-loader.mjs tests/register-pg-test-loader.mjs

      - name: Verify all contracts with PostgreSQL
        env:
          POSTGRES_TEST_URL: postgresql://syntha:syntha_test@127.0.0.1:5432/syntha_v2_test
        run: npm run verify

      - name: Commit verified result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: use the PostgreSQL CommonJS default export in integration tests [pg-driver-applied]"
          git push origin HEAD:automation/generate-package-lock
