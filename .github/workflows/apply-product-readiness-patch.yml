name: Apply Product Readiness Patch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-product-readiness-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: agent/connect-product-readiness-commerce-v22
          fetch-depth: 0

      - name: Apply product readiness patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .automation/product-readiness-patch.tgz.b64 > /tmp/product-readiness-patch.tgz
          echo "2ba65ae0d2e4c3532d7f55b581a5105ee8043ba7c374da39c6920eb892d2d9fb  /tmp/product-readiness-patch.tgz" | sha256sum -c -
          tar -xzf /tmp/product-readiness-patch.tgz
          rm -rf .automation
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: connect product readiness to commercial catalog"
          git push origin HEAD:agent/connect-product-readiness-commerce-v22
