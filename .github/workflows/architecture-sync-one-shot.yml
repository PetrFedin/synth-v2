name: Architecture Sync One Shot

on:
  push:
    branches:
      - feat/acc004-ready-to-buyer-catalog-live
    paths:
      - .github/workflows/architecture-sync-one-shot.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact runtime and architecture patch
        run: node scripts/pr118-runtime-architecture-sync.mjs
      - name: Show guarded diff
        run: git diff -- src/modules/measurements/public.mjs ARCHITECTURE.md
      - name: Commit synchronized runtime truth
        shell: bash
        run: |
          test -n "$(git status --porcelain -- src/modules/measurements/public.mjs ARCHITECTURE.md)"
          git config user.name 'syntha-architecture-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/modules/measurements/public.mjs ARCHITECTURE.md
          git commit -m 'fix(measurements): align canonical MDM snapshot runtime truth'
          git push origin "HEAD:${GITHUB_REF_NAME}"
