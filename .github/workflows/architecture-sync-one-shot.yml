name: Architecture Sync One Shot

on:
  push:
    branches:
      - feat/acc004-ready-to-buyer-catalog-live
    paths:
      - .github/workflows/architecture-sync-one-shot.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch runtime and authoritative architecture
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one anchor in {path}, found {count}: {old[:120]!r}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          module = Path('src/modules/measurements/public.mjs')
          replace_once(
              module,
              """  const snapshot = pointRef.snapshot ?? {};
  const translations = snapshot.translations && typeof snapshot.translations === 'object' && !Array.isArray(snapshot.translations)
    ? snapshot.translations
    : {};
  const russianTranslation = translations.ru && typeof translations.ru === 'object' && !Array.isArray(translations.ru)
    ? translations.ru
    : {};
  const englishTranslation = translations.en && typeof translations.en === 'object' && !Array.isArray(translations.en)
    ? translations.en
    : {};
  const nameRu = requiredText(russianTranslation.name, 2, 120, 'MEASUREMENT_POINT_NAME_INVALID', 'Point of measure RU name');
  const nameEn = requiredText(englishTranslation.name, 2, 120, 'MEASUREMENT_POINT_NAME_INVALID', 'Point of measure EN name');
  const descriptionRu = optionalText(russianTranslation.description, 500, 'MEASUREMENT_POINT_DESCRIPTION_INVALID', 'Point of measure description');
""",
              """  const snapshot = pointRef.snapshot ?? {};
  const translations = snapshot.translations && typeof snapshot.translations === 'object' && !Array.isArray(snapshot.translations)
    ? snapshot.translations
    : {};
  const attributes = snapshot.attributes && typeof snapshot.attributes === 'object' && !Array.isArray(snapshot.attributes)
    ? snapshot.attributes
    : {};
  const nameRu = requiredText(translations.ru, 2, 120, 'MEASUREMENT_POINT_NAME_INVALID', 'Point of measure RU name');
  const nameEn = requiredText(translations.en, 2, 120, 'MEASUREMENT_POINT_NAME_INVALID', 'Point of measure EN name');
  const descriptionRu = optionalText(attributes.descriptionRu, 500, 'MEASUREMENT_POINT_DESCRIPTION_INVALID', 'Point of measure description');
""",
          )

          architecture = Path('ARCHITECTURE.md')
          replace_once(
              architecture,
              "The canonical runtime MDM truth is the exact version snapshot persisted by the MDM store, not the source-registry JSON shape used before bootstrap. Canonical Measurement point localization therefore reads `pointRef.snapshot.translations.ru.name`, `pointRef.snapshot.translations.en.name` and the RU description from `pointRef.snapshot.translations.ru.description`; semantic properties continue to come from the same versioned `snapshot.attributes`. Source dataset aliases such as `name_ru`, `name_en` and `description_ru` are bootstrap input only and are forbidden as runtime fallback fields. A runtime snapshot without the required normalized translation fails closed with `MEASUREMENT_POINT_NAME_INVALID` rather than silently consulting a second source truth. `tests/measurement-runtime-mdm-snapshot.test.mjs` pins both the normalized runtime success case and the source-alias-only rejection.",
              "The canonical runtime MDM truth is the exact immutable `mdm_entry_versions.snapshot` captured by PostgreSQL from the normalized `mdm_entries` row (`to_jsonb(NEW)`), not the source-registry JSON shape used before bootstrap. The operational bootstrap persists localized names as string values in `translations = { ru, en }` and localized descriptions inside the same versioned `attributes` object (`descriptionRu` / `descriptionEn`). Canonical Measurement point localization therefore reads `pointRef.snapshot.translations.ru`, `pointRef.snapshot.translations.en` and RU description from `pointRef.snapshot.attributes.descriptionRu`; semantic properties such as `dimension` come from that same `snapshot.attributes`. Source dataset aliases such as `name_ru`, `name_en` and `description_ru` are bootstrap inputs only and are forbidden as runtime fallbacks. Missing/invalid normalized runtime localization fails closed with `MEASUREMENT_POINT_NAME_INVALID` rather than consulting a second source truth. `tests/measurement-runtime-mdm-snapshot.test.mjs` pins the exact persisted snapshot shape and source-alias-only rejection.",
          )
          replace_once(
              architecture,
              "| CanonicalMeasurementChart | exact same-brand StyleVersion + Colorway + SizeScaleVersion; exact ordered SizeValues; exact current/effective/active governed `measurement.unit` and `measurement.point` versions pinned into chart evidence; runtime point names/descriptions come only from that version snapshot `translations` structure, never source JSON aliases; DRAFT/PUBLISHED revision history is immutable across publication replacement |",
              "| CanonicalMeasurementChart | exact same-brand StyleVersion + Colorway + SizeScaleVersion; exact ordered SizeValues; exact current/effective/active governed `measurement.unit` and `measurement.point` versions pinned into chart evidence; runtime point names come from immutable snapshot `translations.ru/en`, localized descriptions/semantics from the same snapshot `attributes`, never source JSON aliases; DRAFT/PUBLISHED revision history is immutable across publication replacement |",
          )
          replace_once(
              architecture,
              "canonical Measurement now consumes only normalized versioned runtime MDM `translations` instead of source JSON aliases",
              "canonical Measurement now consumes the exact persisted version snapshot shape (`translations.ru/en` strings plus versioned `attributes`) instead of source JSON aliases",
          )
          PY
          git diff -- src/modules/measurements/public.mjs ARCHITECTURE.md
      - name: Commit runtime plus authoritative sync
        shell: bash
        run: |
          if git diff --quiet -- src/modules/measurements/public.mjs ARCHITECTURE.md; then
            echo 'Runtime and architecture already synchronized.'
            exit 0
          fi
          git config user.name 'syntha-architecture-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/modules/measurements/public.mjs ARCHITECTURE.md
          git commit -m 'fix(measurements): align canonical MDM snapshot runtime truth'
          git push origin "HEAD:${GITHUB_REF_NAME}"
