name: Expand Single Master Specification v4.2

on:
  push:
    paths:
      - 'docs/.single-master-v42-append.tmp.md'

permissions:
  contents: write

jobs:
  expand-master:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize and expand the only product specification
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          target = Path('docs/joor-retailer-cabinet-complete-map.md')
          appendix_path = Path('docs/.single-master-v42-append.tmp.md')
          text = target.read_text(encoding='utf-8')

          text = text.replace(
              '# Syntha Fashion Platform — PLM / Supply + Wholesale Commerce',
              '# Платформа Syntha / Syntha Fashion Platform — Product & Supply + Wholesale Commerce'
          )
          text = text.replace(
              'Статус: единственная актуальная продуктовая спецификация и source of truth для Syntha.',
              'Статус / Status: единственная актуальная двуязычная продуктовая спецификация / the only current bilingual product source of truth for Syntha.'
          )
          text = text.replace(
              'Версия: 4.1, 5 августа 2026 года.',
              'Версия / Version: 4.2, 6 августа 2026 года.'
          )

          # Remove the retained catalogue of rejected capabilities. Rejected scope is not stored in the master.
          start = text.find('# ЧТО УБРАТЬ ИЗ ОСНОВНОГО SCOPE')
          end = text.find('# ЦЕЛЕВЫЕ СКВОЗНЫЕ ПРОЦЕССЫ')
          if start != -1 and end != -1 and end > start:
              text = text[:start] + '# ЦЕЛЕВЫЕ СКВОЗНЫЕ ПРОЦЕССЫ' + text[end + len('# ЦЕЛЕВЫЕ СКВОЗНЫЕ ПРОЦЕССЫ'):]

          text = re.sub(r'\n### 18\.3 Что не нужно для российского core\n.*?\n---\n', '\n---\n', text, flags=re.S)
          text = re.sub(r'\nУбрать из core:\n\n(?:- .*\n)+\nТакие проверки можно подключать как enterprise add-on для компаний, которым они реально требуются\.\n', '\n', text)
          text = re.sub(r'\nДля core не нужны:\n\n(?:- .*\n)+', '\n', text)
          text = re.sub(r'\nНе включать в core:\n\n(?:- .*\n)+', '\n', text)
          text = text.replace('Убрать из core process mining, digital twins, cross-tenant benchmarking и autonomous decision engines.\n', '')
          text = re.sub(r'^Не строить.*\n', '', text, flags=re.M)
          text = re.sub(r'^Не превращать.*\n', '', text, flags=re.M)
          text = text.replace('Core deliberately stops at milestone and exception control. Machine scheduling, shop-floor execution and MES are not included.\n', '')
          text = text.replace('| `OUT OF SCOPE` | Не входит в целевой продукт |\n', '')
          text = text.replace('4. Если функция не относится к целевым процессам, она получает статус `OUT OF SCOPE` и не детализируется.\n', '4. Если функция не относится к целевым процессам, она не добавляется в этот документ.\n')

          # Close the numbering gap left by deleted sections 35 and 36.
          def renumber_h2(match):
              n = int(match.group(1))
              return f'## {n - 2}. ' if 37 <= n <= 72 else match.group(0)

          def renumber_h3(match):
              n = int(match.group(1))
              return f'### {n - 2}.{match.group(2)} ' if 37 <= n <= 72 else match.group(0)

          text = re.sub(r'^## (\d+)\. ', renumber_h2, text, flags=re.M)
          text = re.sub(r'^### (\d+)\.(\d+) ', renumber_h3, text, flags=re.M)

          appendix = appendix_path.read_text(encoding='utf-8').strip()
          marker = '## 71. Двуязычная продуктовая модель / Bilingual Product Model'
          if marker not in text:
              text = text.rstrip() + '\n\n---\n\n' + appendix + '\n'

          target.write_text(text, encoding='utf-8')
          PY

      - name: Commit and remove one-time files
        run: |
          rm -f docs/.single-master-v42-append.tmp.md
          rm -f .github/workflows/expand-single-master-v42-once.yml
          git config user.name 'openai-docs-bot'
          git config user.email 'openai-docs-bot@users.noreply.github.com'
          git add -A
          git commit -m 'docs: expand bilingual Omnidata Centric JOOR and NuORDER operating model'
          git push
