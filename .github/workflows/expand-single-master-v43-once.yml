name: Expand Single Master Specification v4.3

on:
  push:
    paths:
      - 'docs/.single-master-v43-append.tmp.md'

permissions:
  contents: write

jobs:
  expand-master:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Expand bilingual end-to-end specification
        run: |
          python3 - <<'PY'
          from pathlib import Path

          target = Path('docs/joor-retailer-cabinet-complete-map.md')
          appendix_path = Path('docs/.single-master-v43-append.tmp.md')
          text = target.read_text(encoding='utf-8')

          text = text.replace(
              'Версия / Version: 4.2, 6 августа 2026 года.',
              'Версия / Version: 4.3, 6 августа 2026 года.'
          )
          text = text.replace(
              'Основной рынок: российские fashion-бренды, работающие с российскими и зарубежными фабриками, поставщиками материалов и поставщиками готовых изделий.',
              'Основной рынок / Primary market: российские fashion-бренды, работающие с российскими и зарубежными фабриками, поставщиками материалов, готовых изделий и магазинами / Russian fashion brands working with domestic and international factories, material suppliers, finished-goods suppliers and retailers.'
          )
          text = text.replace(
              'Назначение: разделить управление разработкой, закупками и производством от B2B-коммерции бренда с магазинами, сохранив единое ядро товарных данных.',
              'Назначение / Purpose: связать Product & Supply и Wholesale Commerce через единое версионное ядро товара, сохранив отдельные процессы, права, документы, статусы и системы учёта / connect Product & Supply and Wholesale Commerce through one versioned product core while preserving separate processes, permissions, documents, states and systems of record.'
          )
          text = text.replace('BOL does not become MES machine scheduling; it remains a product/production specification.\n', '')
          text = text.replace('Only retained capabilities belonging to this operating model are developed in this document.\n', '')

          appendix = appendix_path.read_text(encoding='utf-8').strip()
          marker = '## 104. Каркас полной сквозной спецификации / Complete End-to-End Specification Framework'
          if marker not in text:
              text = text.rstrip() + '\n\n---\n\n' + appendix + '\n'

          target.write_text(text, encoding='utf-8')
          PY

      - name: Commit and remove one-time files
        run: |
          rm -f docs/.single-master-v43-append.tmp.md
          rm -f .github/workflows/expand-single-master-v43-once.yml
          git config user.name 'openai-docs-bot'
          git config user.email 'openai-docs-bot@users.noreply.github.com'
          git add -A
          git commit -m 'docs: deepen bilingual end-to-end product supply and wholesale operating model'
          git push
