name: Generate package lock

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: generate-package-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    if: github.head_ref == 'automation/generate-package-lock' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
      NPM_CONFIG_AUDIT: "false"
      NPM_CONFIG_FUND: "false"
      NPM_CONFIG_IGNORE_SCRIPTS: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Generate lockfile without lifecycle scripts
        run: |
          npm --version
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify clean installation from lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run full repository verification
        shell: bash
        run: |
          set +e
          npm run verify 2>&1 | tee verify.log
          status=${PIPESTATUS[0]}
          echo "$status" > verify-status.txt
          exit "$status"

      - name: Package runner worktree
        if: always()
        shell: bash
        run: tar --exclude=.git --exclude=syntha-runner-worktree.tgz -czf syntha-runner-worktree.tgz .

      - name: Upload generated lockfile and verification diagnostics
        if: always()
        uses: actions/upload-artifact@615b319bd27bb32c3d64dca6b6ed6974d5fbe653 # v6.0.0
        with:
          name: syntha-package-lock
          path: |
            package-lock.json
            verify.log
            verify-status.txt
            syntha-runner-worktree.tgz
          if-no-files-found: error
          retention-days: 1
