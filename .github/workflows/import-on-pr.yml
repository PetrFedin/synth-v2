name: Import Syntha V2 on PR

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  import:
    if: github.head_ref == 'agent/import-syntha-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          repository: PetrFedin/syntha
          ref: agent/v2-foundation-priority-contract
          path: _source

      - name: Build standalone snapshot
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            ! -name '_source' \
            -exec rm -rf {} +
          cp -a _source/apps/syntha-wholesale-v2/. .
          rm -rf _source

          python <<'PY'
          from pathlib import Path
          import json

          for filename in ('.vscode/launch.json', '.vscode/tasks.json'):
              path = Path(filename)
              path.write_text(path.read_text().replace('${workspaceFolder}/apps/syntha-wholesale-v2', '${workspaceFolder}'), encoding='utf-8')

          package_path = Path('package.json')
          package = json.loads(package_path.read_text())
          package['name'] = '@syntha/platform-v2'
          package['version'] = '1.0.0'
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          validator = Path('scripts/validate-isolation.mjs')
          validator.write_text(validator.read_text().replace(
              "const workflow = path.resolve(root, '..', '..', '.github', 'workflows', 'syntha-wholesale-v2.yml');",
              "const workflow = path.resolve(root, '.github', 'workflows', 'import-syntha-v2.yml');"
          ), encoding='utf-8')

          cursor = Path('CURSOR_START_HERE.md')
          cursor.write_text(cursor.read_text().replace(
              'Рабочий проект находится только в `apps/syntha-wholesale-v2` и запускается автономно.',
              'Репозиторий является самостоятельным проектом Syntha V2.'
          ).replace('cd apps/syntha-wholesale-v2\n', ''), encoding='utf-8')
          PY

          cat > README.md <<'EOF'
          # Syntha V2

          Standalone fashion B2B operating platform for brands, retailers, distributors and production partners.

          Syntha V2 combines and extends the strongest operating patterns of JOOR, NuORDER, Brandboom, Centra and adjacent platforms without copying proprietary implementations.

          ## Executable core

          `Campaign → Collection → Showroom → Selection → Order Builder → Order → Confirmation → DealSpace`

          The current system includes PostgreSQL-owned authentication, organisation RBAC, partner access, digital showrooms, server-authoritative catalog pricing, MOQ and ATS controls, atomic inventory reservations, bilateral confirmation, DealSpace, calendar milestones, notifications, OpenAPI and a standalone web workspace.

          ## Product direction

          Digital linesheets and buyer collaboration; assortment planning, budgets, doors and size curves; wholesale CRM and payments; style/color/size catalog; PLM, BOM and samples; production, QC, logistics and landed cost; analytics and integration APIs.

          ## Start

          ```bash
          cp .env.example .env
          npm install
          docker compose up -d
          npm run bootstrap:owner
          npm run dev
          ```

          Run `npm run verify` before publishing changes.
          EOF

          cat > AGENTS.md <<'EOF'
          # Syntha V2 agent rules

          - This repository is the only active Syntha V2 codebase.
          - Never modify or import code from frozen legacy Syntha applications.
          - Do not introduce Firebase or another external identity provider.
          - Cross-module imports go only through `public.mjs`.
          - Business mutations require durable command IDs and transactional outbox events.
          - Applied SQL migrations are immutable.
          - Preserve organisation isolation, server-authoritative pricing and atomic inventory guarantees.
          - Run `npm run verify` before publishing.
          - Priority: fashion catalog/planning, PLM/BOM/samples, production, QC, logistics, landed cost, analytics and integrations.
          EOF

          cat > ARCHITECTURE.md <<'EOF'
          # Syntha V2 Architecture

          Syntha V2 is an autonomous fashion B2B operating platform owning its backend, web workspace, PostgreSQL schema, authentication, APIs, workflows and tests. It does not depend on the legacy Syntha repository or Firebase.

          ## Commercial route

          `Campaign → Collection → Showroom → Selection → Order Builder → Order → Confirmation → DealSpace`

          ## Domains

          Identity and RBAC; partner CRM; campaigns, collections and showrooms; style/color/size catalog and availability; selection and assortment planning; orders and commercial terms; DealSpace, documents, payments, calendar and notifications; PLM/BOM/samples; production/QC/logistics/landed cost; analytics and integrations.

          ## Guarantees

          Actor identity is server-derived; access is organisation-scoped; catalog price and currency are server-authoritative; order totals use trusted snapshots; reservations and releases are atomic in PostgreSQL; commands are idempotent; events use a transactional outbox; migration checksums and readiness prevent schema drift.
          EOF

          git add -A
          if git diff --cached --quiet; then
            echo 'Standalone snapshot already current.'
            exit 0
          fi
          git config user.name 'syntha-v2-importer'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'feat: import standalone Syntha V2 platform'
          git push origin HEAD:${{ github.head_ref }}
