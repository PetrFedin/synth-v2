name: MDM Reference Data

on:
  pull_request:
    paths:
      - "mdm/**"
      - "scripts/validate-mdm.mjs"
      - "scripts/sync-mdm-sources.mjs"
      - "db/migrations/023_mdm_core.sql"
      - "package.json"
  push:
    branches:
      - main
    paths:
      - "mdm/**"
      - "scripts/validate-mdm.mjs"
      - "scripts/sync-mdm-sources.mjs"
      - "db/migrations/023_mdm_core.sql"
      - "package.json"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate governed MDM catalogs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
      - run: node scripts/validate-mdm.mjs

  source-sync:
    name: Detect authoritative source changes
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
      - name: Probe registered sources
        run: node scripts/sync-mdm-sources.mjs
      - name: Open governed update pull request
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No source fingerprints changed."
            exit 0
          fi
          branch="automation/mdm-source-sync-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add mdm/generated/source-state.json mdm/catalog mdm/attributes mdm/metrics 2>/dev/null || true
          git commit -m "chore(mdm): refresh authoritative source state"
          git push --set-upstream origin "$branch"
          gh pr create --base main --head "$branch" --title "chore(mdm): review authoritative source changes" --body "Automated source monitoring detected changed upstream fingerprints. Review licensing, effective dates, correlations and adapter output before approval. No production master data is changed silently."
