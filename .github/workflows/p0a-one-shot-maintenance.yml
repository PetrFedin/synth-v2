name: P0-A one-shot compatibility patch

on:
  push:
    branches:
      - feat/pub-005-canonical-selection-order-commit
    paths:
      - .github/workflows/p0a-one-shot-maintenance.yml

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          ref: feat/pub-005-canonical-selection-order-commit
          fetch-depth: 0

      - name: Apply bounded P0-A compatibility corrections
        run: |
          python - <<'PY'
          from pathlib import Path

          acceptance = Path('src/acceptance/buyer-order-live-acceptance.mjs')
          text = acceptance.read_text()
          old = "}, { status: 422, code: 'BUYER_CATALOG_PRODUCT_SKU_NOT_FOUND' });"
          new = "}, { status: 404, code: 'BUYER_CATALOG_PRODUCT_SKU_NOT_FOUND' });"
          if text.count(old) != 1:
              raise SystemExit('expected exactly one wrong-ProductSku HTTP expectation')
          acceptance.write_text(text.replace(old, new, 1))

          helper = Path('tests/postgres/legacy-commercial-fixture.mjs')
          helper.write_text("""const LEGACY_INSERT_GUARDS = Object.freeze([
            ['selections', 'selections_000_canonical_new_write'],
            ['orders', 'orders_000_canonical_new_write'],
            ['order_commit_snapshots', 'order_commit_000_canonical_new_write'],
          ]);

          /**
           * Test-only compatibility helper for facts that represent history predating
           * migration 076. Production code must never disable these guards.
           *
           * The helper deliberately disables only forward-only INSERT guards. UPDATE
           * guards remain active, and migration 076 itself still validates every fresh
           * canonical write. PostgreSQL verification runs serially. The setup client is
           * released before the fixture action so low-capacity pools cannot deadlock while
           * the explicit historical fixture is being constructed.
           */
          export async function withLegacyCommercialInsertGuardsDisabled(pool, action) {
            if (!pool || typeof pool.connect !== 'function') throw new TypeError('PostgreSQL pool is required');
            if (typeof action !== 'function') throw new TypeError('Historical fixture action is required');

            const disabled = [];
            let result;
            let actionError = null;
            let restoreError = null;

            const setupClient = await pool.connect();
            try {
              for (const [table, trigger] of LEGACY_INSERT_GUARDS) {
                await setupClient.query(`ALTER TABLE ${table} DISABLE TRIGGER ${trigger}`);
                disabled.push([table, trigger]);
              }
            } catch (error) {
              actionError = error;
            } finally {
              setupClient.release();
            }

            if (!actionError) {
              try {
                result = await action(pool);
              } catch (error) {
                actionError = error;
              }
            }

            if (disabled.length) {
              const restoreClient = await pool.connect();
              try {
                for (const [table, trigger] of disabled.reverse()) {
                  try {
                    await restoreClient.query(`ALTER TABLE ${table} ENABLE TRIGGER ${trigger}`);
                  } catch (error) {
                    restoreError ??= error;
                  }
                }
              } finally {
                restoreClient.release();
              }
            }

            if (actionError) throw actionError;
            if (restoreError) throw restoreError;
            return result;
          }
          """)

          legacy_tests = [
              'tests/postgres-integration.test.mjs',
              'tests/zr-postgres-fulfillment.test.mjs',
              'tests/zs-postgres-order-fx.test.mjs',
              'tests/zs-postgres-receipt-claims.test.mjs',
              'tests/zt-postgres-pinned-commercial-reservation.test.mjs',
              'tests/zt-postgres-product-sku-inventory-reservation.test.mjs',
              'tests/zt-postgres-supplier-recovery.test.mjs',
              'tests/zu-postgres-order-cancellation.test.mjs',
              'tests/zv-postgres-availability-rollback.test.mjs',
          ]
          import_line = "import { withLegacyCommercialInsertGuardsDisabled } from './postgres/legacy-commercial-fixture.mjs';\n"
          wrapper = "    await withLegacyCommercialInsertGuardsDisabled(pool, async () => {\n"
          for relative in legacy_tests:
              path = Path(relative)
              source = path.read_text()
              if import_line not in source:
                  source = import_line + source
              if wrapper not in source:
                  migration = source.find('await migratePostgres(')
                  if migration < 0:
                      raise SystemExit(f'{relative}: migratePostgres call not found')
                  end = source.find(');', migration)
                  if end < 0:
                      raise SystemExit(f'{relative}: migratePostgres call end not found')
                  insert_at = end + 2
                  if insert_at < len(source) and source[insert_at] == '\n':
                      insert_at += 1
                  source = source[:insert_at] + wrapper + source[insert_at:]
                  finally_marker = '\n  } finally {'
                  close_at = source.find(finally_marker, insert_at + len(wrapper))
                  if close_at < 0:
                      raise SystemExit(f'{relative}: outer finally marker not found')
                  source = source[:close_at] + '\n    });' + source[close_at:]
              path.write_text(source)

          workflow = Path('.github/workflows/p0a-one-shot-maintenance.yml')
          workflow.unlink()
          PY

      - name: Verify patched source syntax and diff hygiene
        run: |
          node --check src/acceptance/buyer-order-live-acceptance.mjs
          node --check tests/postgres/legacy-commercial-fixture.mjs
          for file in \
            tests/postgres-integration.test.mjs \
            tests/zr-postgres-fulfillment.test.mjs \
            tests/zs-postgres-order-fx.test.mjs \
            tests/zs-postgres-receipt-claims.test.mjs \
            tests/zt-postgres-pinned-commercial-reservation.test.mjs \
            tests/zt-postgres-product-sku-inventory-reservation.test.mjs \
            tests/zt-postgres-supplier-recovery.test.mjs \
            tests/zu-postgres-order-cancellation.test.mjs \
            tests/zv-postgres-availability-rollback.test.mjs; do
            node --check "$file"
          done
          git diff --check

      - name: Commit bounded compatibility patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ACC-004: isolate remaining pre-076 PostgreSQL fixtures"
          git push origin HEAD:feat/pub-005-canonical-selection-order-commit
