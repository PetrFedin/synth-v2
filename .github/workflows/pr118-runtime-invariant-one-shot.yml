name: PR118 Runtime Invariant One Shot

on:
  push:
    branches:
      - feat/acc004-ready-to-buyer-catalog-live
    paths:
      - scripts/pr118-runtime-invariant-one-shot.mjs
      - .github/workflows/pr118-runtime-invariant-one-shot.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/acc004-ready-to-buyer-catalog-live
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply guarded patch
        run: node scripts/pr118-runtime-invariant-one-shot.mjs
      - name: Remove one-shot helpers
        run: rm scripts/pr118-runtime-invariant-one-shot.mjs .github/workflows/pr118-runtime-invariant-one-shot.yml
      - name: Commit synchronized runtime and architecture changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: align READY inventory identity and MDM fixtures"
          git push origin HEAD:feat/acc004-ready-to-buyer-catalog-live

# One-shot trigger: remove this workflow after the guarded patch commit.
