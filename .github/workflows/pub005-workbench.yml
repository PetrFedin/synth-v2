name: PUB-005 isolated workbench
on:
  push:
    branches: [fix/pub005-canonical-commercial-writes]
    paths: [.github/workflows/pub005-workbench.yml]
permissions:
  contents: write
jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: syntha
          POSTGRES_PASSWORD: syntha_test
          POSTGRES_DB: syntha_v2_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U syntha -d syntha_v2_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      POSTGRES_TEST_URL: postgresql://syntha:syntha_test@127.0.0.1:5432/syntha_v2_test
      DATABASE_URL: postgresql://syntha:syntha_test@127.0.0.1:5432/syntha_v2_test
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
      - name: Build committed final PR tree from reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/pub005-patch/chunk-* > /tmp/pub005.patch
          echo '75d526f6c2624ea8dbd9c209e43c2bdbaef1bc06e853d6b1cf16000f599b6ea2  /tmp/pub005.patch' | sha256sum -c -
          git apply --check /tmp/pub005.patch
          git apply /tmp/pub005.patch
          python - <<'PY'
          from pathlib import Path

          architecture = Path('ARCHITECTURE.md')
          text = architecture.read_text()
          old = '`fix/pub005-canonical-commercial-writes` (PR pending)'
          new = '#119 / `fix/pub005-canonical-commercial-writes`'
          assert old in text and text.count(old) == 1
          architecture.write_text(text.replace(old, new))

          migration = Path('db/migrations/075_canonical_buyer_catalog_new_writes.sql')
          sql = migration.read_text()
          old_guard = """  IF publication.id IS NULL OR price.id IS NULL OR showroom.id IS NULL OR invitation.id IS NULL THEN
    RAISE EXCEPTION 'BUYER_CATALOG_CANONICAL_ROW_MISMATCH' USING ERRCODE = '23514';
  END IF;

  -- Revalidate the referenced PriceList even if it predates this migration: a
  -- historical V1 PriceList is readable history, not a fresh BuyerCatalog seed.
  PERFORM assert_canonical_commercial_price(publication.payload, price.payload);
"""
          new_guard = """  IF publication.id IS NULL OR price.id IS NULL THEN
    RAISE EXCEPTION 'BUYER_CATALOG_CANONICAL_ROW_MISMATCH' USING ERRCODE = '23514';
  END IF;

  -- Revalidate the commercial source before validating buyer-access topology.
  -- A historical V1 publication/PriceList remains readable history and cannot
  -- be misclassified as a malformed fresh BuyerCatalog merely because its old
  -- snapshot has no modern invitation row.
  PERFORM assert_canonical_commercial_price(publication.payload, price.payload);

  IF showroom.id IS NULL OR invitation.id IS NULL THEN
    RAISE EXCEPTION 'BUYER_CATALOG_CANONICAL_ROW_MISMATCH' USING ERRCODE = '23514';
  END IF;
"""
          assert old_guard in sql and sql.count(old_guard) == 1
          migration.write_text(sql.replace(old_guard, new_guard))
          PY
          rm -rf .github/pub005-patch
          rm .github/workflows/pub005-workbench.yml
          git diff --check
          git config user.name 'Syntha CI Workbench'
          git config user.email 'syntha-ci@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(pub005): enforce canonical buyer commercial new writes'
          git status --short
          printf '%s\n' '{"before":"0048d10c410231055d13436d61d0cf33db3e95b7"}' > /tmp/pub005-event.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify committed final PR tree including PostgreSQL contract
        id: verify
        env:
          GITHUB_EVENT_PATH: /tmp/pub005-event.json
        shell: bash
        run: |
          set +e
          npm run verify:postgres > /tmp/pub005-verify.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo 'PUB005_VERIFY_FAILURE_SUMMARY_BEGIN'
            grep -nEi '(^not ok|npm error|ERR_|AssertionError|error:|failure|failed|expected|actual|23514|55000)' /tmp/pub005-verify.log | tail -n 240 || true
            echo 'PUB005_VERIFY_FAILURE_TAIL_BEGIN'
            tail -n 180 /tmp/pub005-verify.log || true
            echo 'PUB005_VERIFY_FAILURE_TAIL_END'
          fi
          exit "$status"
      - name: Upload verification diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pub005-verify-diagnostics
          path: /tmp/pub005-verify.log
          if-no-files-found: error
          retention-days: 3
      - name: Push verified final tree to PR branch
        if: success()
        run: git push origin HEAD:fix/pub005-canonical-commercial-writes
