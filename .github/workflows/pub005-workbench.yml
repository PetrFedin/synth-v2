name: PUB-005 isolated workbench
on:
  push:
    branches: [fix/pub005-canonical-commercial-writes]
    paths: [.github/workflows/pub005-workbench.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
      - name: Install locked test dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Archive dependencies only
        run: tar -czf /tmp/syntha-test-dependencies.tar.gz node_modules
      - uses: actions/upload-artifact@615b319bd27bb32c3d64dca6b6ed6974d5fbe653
        with:
          name: pub005-test-dependencies
          path: /tmp/syntha-test-dependencies.tar.gz
          retention-days: 1
          if-no-files-found: error
