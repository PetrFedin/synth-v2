name: PUB-005 isolated workbench
on:
  push:
    branches: [fix/pub005-canonical-commercial-writes]
    paths: [.github/workflows/pub005-workbench.yml]
permissions:
  contents: write
jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: syntha
          POSTGRES_PASSWORD: syntha_test
          POSTGRES_DB: syntha_v2_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U syntha -d syntha_v2_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      POSTGRES_TEST_URL: postgresql://syntha:syntha_test@127.0.0.1:5432/syntha_v2_test
      DATABASE_URL: postgresql://syntha:syntha_test@127.0.0.1:5432/syntha_v2_test
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
      - name: Build committed final PR tree from reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/pub005-patch/chunk-* > /tmp/pub005.patch
          echo '75d526f6c2624ea8dbd9c209e43c2bdbaef1bc06e853d6b1cf16000f599b6ea2  /tmp/pub005.patch' | sha256sum -c -
          git apply --check /tmp/pub005.patch
          git apply /tmp/pub005.patch
          python - <<'PY'
          from pathlib import Path
          path = Path('ARCHITECTURE.md')
          text = path.read_text()
          old = '`fix/pub005-canonical-commercial-writes` (PR pending)'
          new = '#119 / `fix/pub005-canonical-commercial-writes`'
          assert old in text and text.count(old) == 1
          path.write_text(text.replace(old, new))
          PY
          rm -rf .github/pub005-patch
          rm .github/workflows/pub005-workbench.yml
          git diff --check
          git config user.name 'Syntha CI Workbench'
          git config user.email 'syntha-ci@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(pub005): enforce canonical buyer commercial new writes'
          git status --short
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify committed final PR tree including PostgreSQL contract
        run: npm run verify:postgres
      - name: Push verified final tree to PR branch
        run: git push origin HEAD:fix/pub005-canonical-commercial-writes
