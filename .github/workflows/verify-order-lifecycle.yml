name: Verify Order Lifecycle Industrialization

on:
  push:
    branches:
      - automation/order-lifecycle-concurrency
    paths:
      - '.automation/order-patch-*.mjs'
      - '.github/workflows/verify-order-lifecycle.yml'
      - 'tests/order-*.test.mjs'
  pull_request:
    branches:
      - main
    paths:
      - '.automation/order-patch-*.mjs'
      - '.github/workflows/verify-order-lifecycle.yml'
      - 'src/application/order-builder-service.mjs'
      - 'src/http/routes.mjs'
      - 'src/modules/orders/public.mjs'
      - 'tests/order-*.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-order-lifecycle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Apply deterministic patches
        run: |
          node .automation/order-patch-http.mjs
          node .automation/order-patch-forms.mjs
          node .automation/order-patch-omnidata.mjs
          rm .automation/order-patch-utils.mjs
          rm .automation/order-patch-http.mjs
          rm .automation/order-patch-forms.mjs
          rm .automation/order-patch-omnidata.mjs
          rm .github/workflows/verify-order-lifecycle.yml

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify repository
        run: npm run verify 2>&1 | tee order-lifecycle-verify.log

      - name: Package verified files
        run: |
          mkdir -p artifact/src/http artifact/public/modules
          cp src/http/api.mjs artifact/src/http/api.mjs
          cp src/http/openapi.mjs artifact/src/http/openapi.mjs
          cp public/modules/i18n-runtime.js artifact/public/modules/i18n-runtime.js
          cp public/modules/dom-1.js artifact/public/modules/dom-1.js
          cp public/modules/forms-3.js artifact/public/modules/forms-3.js
          cp public/modules/omnidata-workspace.js artifact/public/modules/omnidata-workspace.js
          git diff --binary -- src/http/api.mjs src/http/openapi.mjs public/modules/i18n-runtime.js public/modules/dom-1.js public/modules/forms-3.js public/modules/omnidata-workspace.js > artifact/order-lifecycle.patch
          cp order-lifecycle-verify.log artifact/order-lifecycle-verify.log

      - name: Upload verified result
        uses: actions/upload-artifact@615b319bd27bb32c3d64dca6b6ed6974d5fbe653
        with:
          name: order-lifecycle-verified
          path: artifact
          if-no-files-found: error
          retention-days: 1
