services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: syntha
      POSTGRES_PASSWORD: syntha_local
      POSTGRES_DB: syntha_v2
    ports:
      - "5434:5432"
    volumes:
      - syntha_v2_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syntha -d syntha_v2"]
      interval: 5s
      timeout: 5s
      retries: 12

  postgres-test:
    image: postgres:17
    environment:
      POSTGRES_USER: syntha
      POSTGRES_PASSWORD: syntha_test
      POSTGRES_DB: syntha_v2_test
    ports:
      - "5435:5432"
    volumes:
      - syntha_v2_postgres_test:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syntha -d syntha_v2_test"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  syntha_v2_postgres:
  syntha_v2_postgres_test:
